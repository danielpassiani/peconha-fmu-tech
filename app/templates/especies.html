{% extends "base.html" %}
{% block title %}Espécies{% endblock %}
{% block content %}
<section class="secao">
  <div class="container">
    <div class="secao-titulo">
      <h1>Catálogo de espécies</h1>
      <p>Conheça os animais peçonhentos que mais causam acidentes no Brasil, como reconhecê-los e como se proteger.</p>
    </div>
    <div class="filtros" id="filtros-grupo" role="group" aria-label="Filtrar por grupo">
      <button class="chip" data-grupo="" aria-pressed="true">Todos</button>
    </div>
    <div class="grid grid-3" id="lista-especies"><p class="carregando">Carregando…</p></div>
  </div>
</section>

<dialog class="modal" id="modal-especie" aria-labelledby="modal-titulo">
  <div class="modal-topo">
    <button class="modal-fechar" aria-label="Fechar" onclick="this.closest('dialog').close()">✕</button>
    <h2 id="modal-titulo"></h2>
    <p id="modal-cientifico"></p>
  </div>
  <div class="modal-corpo" id="modal-corpo"></div>
</dialog>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/especies.js') }}"></script>
{% endblock %}
